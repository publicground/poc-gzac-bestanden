replicaCount: 1

args: ["java", "-Dcom.sun.management.jmxremote=true", "-Dcom.sun.management.jmxremote.port=8086", "-Dcom.sun.management.jmxremote.rmi.port=8087", "-Dcom.sun.management.jmxremote.authenticate=false", "-Dcom.sun.management.jmxremote.ssl=false", "-XX:MinRAMPercentage=20.0","-XX:MaxRAMPercentage=80.0","-XshowSettings:vm","-Djava.security.egd=file:/dev/./urandom", "-agentlib:jdwp=transport=dt_socket,server=y,suspend=n,address=*:5005", "-jar","/app.war"]

## Extra labels to add to Pod
##
podLabels:
  public-access: allow

# Liveness probe is disabled on test. This in order to facilitate remote debugging on this environment.
livenessProbe:
  enabled: false
## Configure the ingress resource that allows you to access the
## app installation. Set up the URL
## ref: http://kubernetes.io/docs/user-guide/ingress/
##
ingress:
  pathType: Prefix

  ingressClassName: azure-application-gateway

  hostname: sd-zgw.test.denhaag.nl

  existingTlsSecret: zgw-tls-secret

  path: /api/

  annotations:
    appgw.ingress.kubernetes.io/rewrite-rule-set: zgw-rewriteset1
    appgw.ingress.kubernetes.io/ssl-redirect: "true"
    appgw.ingress.kubernetes.io/use-private-ip: "true"
    appgw.ingress.kubernetes.io/health-probe-path: /api/v1/ping

## Autoscaling configuration
##
autoscaling:
  enabled: false
  minReplicas: 1
  maxReplicas: 10
  # targetCPU: 50
  # targetMemory: 50

