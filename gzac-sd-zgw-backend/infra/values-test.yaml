extraObjects:
- apiVersion: networking.k8s.io/v1
  kind: Ingress
  metadata:
    name: '{{ include "common.names.fullname" . }}-camunda'
    namespace: '{{ .Release.Namespace }}'
    annotations:
      appgw.ingress.kubernetes.io/rewrite-rule-set: zgw-rewriteset1
      appgw.ingress.kubernetes.io/ssl-redirect: 'true'
      appgw.ingress.kubernetes.io/use-private-ip: 'true'
      appgw.ingress.kubernetes.io/health-probe-status-codes: '403'
      appgw.ingress.kubernetes.io/cookie-based-affinity: "true"
      meta.helm.sh/release-name: '{{ include "common.names.fullname" . }}'
      meta.helm.sh/release-namespace: '{{ .Release.Namespace }}'
    labels:
      app.kubernetes.io/instance: '{{ include "common.names.fullname" . }}'
      app.kubernetes.io/managed-by: '{{ .Release.Service }}'
      app.kubernetes.io/name: '{{ include "common.names.fullname" . }}'
  spec:
    ingressClassName: '{{ .Values.ingress.ingressClassName }}'
    rules:
    - host: '{{ .Values.ingress.hostname }}'
      http:
        paths:
        - backend:
            service:
              name: '{{ include "common.names.fullname" . }}'
              port:
                name: app
          path: /camunda/
          pathType: Prefix
    tls:
    - hosts:
      - '{{ .Values.ingress.hostname }}'
      secretName: '{{ .Values.ingress.existingTlsSecret }}'

persistence:
  enabled: true
  storageClass: zgw-t-azurefile-csi
  accessMode: ReadWriteMany
  size: 1Gi
  mountPath: /data

volumes:
- name: tmpfs-1
  emptyDir: {}
- name: wsg-jks-vol
  secret:
    # This secret is not managed by this infra yaml. The secret is deployed by Devops Den Haag
    secretName: wsgateway-ot-denhaag-nl-full-chain-jks
- name: wsg-wmv-client-jks-vol
  secret:
    secretName: '{{ include "app.fullname" . }}-test-wsg-wmv-client-cert-jks'
- name: wsg-sd-io-jks-vol
  secret:
      secretName: '{{ include "app.fullname" . }}-io-test-jks'

volumeMounts:
- mountPath: /tmp
  name: tmpfs-1
- mountPath: /certs
  name: wsg-jks-vol
- mountPath: /certs/haalcentraal
  name: wsg-wmv-client-jks-vol
- mountPath: /certs/haalcentraal-io
  name: wsg-sd-io-jks-vol
