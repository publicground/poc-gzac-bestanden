## Sync objects from Azure keyvault to kubernetes as secrets
##
##   sync-1:
##    vaultname: azurekeyvaltname # name of the azure keyvault
##    objectname: test-secret # secretname stored in AKV
##    objecttype: secret # objecttype in AKV
##    output:
##      transform: # optional transformers executed in listed order
##      - trim # optional - trims empty space
##      - base64encode # optional - encode to base64
##      - base64decode # optional - decode from base64
##      secret:
##        name: testsecret # secretname to create in kubernetes
##        dataKey: TEST_SECRET #key to store in secret
##
## The above example will create 1 secret in kubernetes from Azure keyvault
## Supported vault object types: secret, certificate, key, multi-key-value-secret
##
vaultname: kv-zgw-ota-weu-01
syncAKV:
  sync-1:
    vaultname: '{{ .Values.vaultname }}'
    objectname: '{{ include "app.fullname" . }}-acc-keycloak-credentials-secret'
    objecttype: secret
    output:
      secret:
        name: '{{ include "app.fullname" . }}'
        dataKey: KEYCLOAK_CREDENTIALS_SECRET
  sync-2:
    vaultname: '{{ .Values.vaultname }}'
    objectname: '{{ include "app.fullname" . }}-acc-spring-datasource-password'
    objecttype: secret
    output:
      secret:
        name: '{{ include "app.fullname" . }}'
        dataKey: SPRING_DATASOURCE_PASSWORD
  sync-3:
    vaultname: '{{ .Values.vaultname }}'
    objectname: '{{ include "app.fullname" . }}-acc-valtimo-connector-encryption-secret'
    objecttype: secret
    output:
      secret:
        name: '{{ include "app.fullname" . }}'
        dataKey: VALTIMO_CONNECTOR_ENCRYPTION_SECRET
  sync-4:
    vaultname: '{{ .Values.vaultname }}'
    objectname: '{{ include "app.fullname" . }}-acc-spring-datasource-url'
    objecttype: secret
    output:
      secret:
        name: '{{ include "app.fullname" . }}'
        dataKey: SPRING_DATASOURCE_URL
  sync-5:
    vaultname: '{{ .Values.vaultname }}'
    objectname: '{{ include "app.fullname" . }}-acc-spring-datasource-username'
    objecttype: secret
    output:
      secret:
        name: '{{ include "app.fullname" . }}'
        dataKey: SPRING_DATASOURCE_USERNAME
  sync-6:
    vaultname: '{{ .Values.vaultname }}'
    objectname: '{{ include "app.fullname" . }}-acc-valtimo-plugin-encryption-secret'
    objecttype: secret
    output:
      secret:
        name: '{{ include "app.fullname" . }}'
        dataKey: VALTIMO_PLUGIN_ENCRYPTION_SECRET
  sync-7:
      vaultname: '{{ .Values.vaultname }}'
      objectname: 'suwinet-simulator-acc-suwinet-password'
      objecttype: secret
      output:
          secret:
              name: '{{ include "app.fullname" . }}'
              dataKey: AUTODEPLOYMENT_PLUGINCONFIG_SUWINET_SIMULATOR_BASIC_SECRET
  sync-8:
    vaultname: '{{ .Values.vaultname }}'
    objectname: '{{ include "app.fullname" . }}-acc-camunda-bpm-adminuser-password'
    objecttype: secret
    output:
      secret:
        name: '{{ include "app.fullname" . }}'
