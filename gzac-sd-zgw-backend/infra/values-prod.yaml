## Sync objects from Azure keyvault to kubernetes as secrets
##
##   sync-1:
##    vaultname: azurekeyvaltname # name of the azure keyvault
##    objectname: test-secret # secretname stored in AKV
##    objecttype: secret # objecttype in AKV
##    output:
##      transform: # optional transformers executed in listed order
##      - trim # optional - trims empty space
##      - base64encode # optional - encode to base64
##      - base64decode # optional - decode from base64
##      secret:
##        name: testsecret # secretname to create in kubernetes
##        dataKey: TEST_SECRET #key to store in secret
##
## The above example will create 1 secret in kubernetes from Azure keyvault
## Supported vault object types: secret, certificate, key, multi-key-value-secret
##
vaultname: kv-zgw-p-weu-01
syncAKV:
  sync-1:
    vaultname: '{{ .Values.vaultname }}'
    objectname: '{{ include "app.fullname" . }}-prod-keycloak-credentials-secret'
    objecttype: secret
    output:
      secret:
        name: '{{ include "app.fullname" . }}'
        dataKey: KEYCLOAK_CREDENTIALS_SECRET
  sync-2:
    vaultname: '{{ .Values.vaultname }}'
    objectname: '{{ include "app.fullname" . }}-prod-spring-datasource-password'
    objecttype: secret
    output:
      secret:
        name: '{{ include "app.fullname" . }}'
        dataKey: SPRING_DATASOURCE_PASSWORD
  sync-3:
    vaultname: '{{ .Values.vaultname }}'
    objectname: '{{ include "app.fullname" . }}-prod-valtimo-connector-encryption-secret'
    objecttype: secret
    output:
      secret:
        name: '{{ include "app.fullname" . }}'
        dataKey: VALTIMO_CONNECTOR_ENCRYPTION_SECRET
  sync-4:
    vaultname: '{{ .Values.vaultname }}'
    objectname: '{{ include "app.fullname" . }}-prod-spring-datasource-url'
    objecttype: secret
    output:
      secret:
        name: '{{ include "app.fullname" . }}'
        dataKey: SPRING_DATASOURCE_URL
  sync-5:
    vaultname: '{{ .Values.vaultname }}'
    objectname: '{{ include "app.fullname" . }}-prod-spring-datasource-username'
    objecttype: secret
    output:
      secret:
        name: '{{ include "app.fullname" . }}'
        dataKey: SPRING_DATASOURCE_USERNAME
  sync-6:
    vaultname: '{{ .Values.vaultname }}'
    objectname: '{{ include "app.fullname" . }}-prod-valtimo-plugin-encryption-secret'
    objecttype: secret
    output:
      secret:
        name: '{{ include "app.fullname" . }}'
        dataKey: VALTIMO_PLUGIN_ENCRYPTION_SECRET
  sync-7:
      vaultname: '{{ .Values.vaultname }}'
      objectname: 'suwinet-simulator-prod-suwinet-password'
      objecttype: secret
      output:
          secret:
              name: '{{ include "app.fullname" . }}'
              dataKey: AUTODEPLOYMENT_PLUGINCONFIG_SUWINET_SIMULATOR_BASIC_SECRET
  sync-8:
    vaultname: '{{ .Values.vaultname }}'
    objectname: '{{ include "app.fullname" . }}-prod-camunda-bpm-adminuser-password'
    objecttype: secret
    output:
      secret:
        name: '{{ include "app.fullname" . }}'
        dataKey: CAMUNDA_BPM_ADMINUSER_PASSWORD
  sync-9:
      vaultname: '{{ .Values.vaultname }}'
      objectname: '{{ include "app.fullname" . }}-prod-new-relic-license-key'
      objecttype: secret
      output:
          secret:
              name: '{{ include "app.fullname" . }}'
              dataKey: NEW_RELIC_LICENSE_KEY
  sync-10:
      vaultname: '{{ .Values.vaultname }}'
      objectname: '{{ include "app.fullname" . }}-prod-wsg-wmv-client-cert-jks'
      objecttype: secret
      output:
          transform:
              - base64decode
          secret:
              name: '{{ include "app.fullname" . }}-prod-wsg-wmv-client-cert-jks'
              dataKey: '{{ include "app.fullname" . }}-prod-wsg-wmv-client-cert.jks'
  sync-11:
