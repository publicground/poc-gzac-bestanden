extraObjects:
- apiVersion: networking.k8s.io/v1
  kind: Ingress
  metadata:
    name: '{{ include "common.names.fullname" . }}-camunda'
    namespace: '{{ .Release.Namespace }}'
    annotations:
      nginx.ingress.kubernetes.io/force-ssl-redirect: "true"
      nginx.ingress.kubernetes.io/use-regex: "true"
      nginx.ingress.kubernetes.io/affinity: "cookie"
      nginx.ingress.kubernetes.io/session-cookie-path: "/"
      meta.helm.sh/release-name: '{{ include "common.names.fullname" . }}'
      meta.helm.sh/release-namespace: '{{ .Release.Namespace }}'
    labels:
      app.kubernetes.io/instance: '{{ include "common.names.fullname" . }}'
      app.kubernetes.io/managed-by: '{{ .Release.Service }}'
      app.kubernetes.io/name: '{{ include "common.names.fullname" . }}'
  spec:
    ingressClassName: nginx
    rules:
    - host: '{{ .Values.ingress.hostname }}'
      http:
        paths:
        - backend:
            service:
              name: '{{ include "common.names.fullname" . }}'
              port:
                name: app
          path: /camunda/(.*)
          pathType: ImplementationSpecific
    tls:
    - hosts:
      - '{{ .Values.ingress.hostname }}'
      secretName: '{{ .Values.ingress.existingTlsSecret }}'

persistence:
  enabled: true
  storageClass: zgw-p-azurefile-csi
  accessMode: ReadWriteMany
  size: 1Gi
  mountPath: /data

volumes:
- name: tmpfs-1
  emptyDir: {}
- name: wsg-jks-vol
  secret:
    # This secret is not managed by this infra yaml. The secret is deployed by Devops Den Haag
    secretName: wsgateway-prod-denhaag-nl-full-chain-jks
- name: wsg-wmv-client-jks-vol
  secret:
    secretName: '{{ include "app.fullname" . }}-prod-wsg-wmv-client-cert-jks'

volumeMounts:
- mountPath: /tmp
  name: tmpfs-1
- mountPath: /certs
  name: wsg-jks-vol
- mountPath: /certs/haalcentraal
  name: wsg-wmv-client-jks-vol
